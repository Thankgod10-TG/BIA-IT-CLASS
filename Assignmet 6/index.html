<head>

    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsiveness.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">

<body>
    <div class="container">

        <div class="grid-container">
            <div class="box box1" >
                <h1>Elevate Your <br>  
                    <span> Startup</span>
               <br> Success

                    <img src="logo.png" alt="" width="63px">
                    <img src="logo.png" alt="" width="63px">
                    <img src="logo.png" alt="" width="63px">
                </div>
                
               <form action="">
                <input type="text" placeholder="Enter your email and get a discount">
                <button type="submit">Start &nbsp; <ion-icon name="arrow-forward-outline"></ion-icon></button>
               </form>
            </div>
            <div class="box box2" >
                <img src="wp.jpg" alt="">
            </div>
            <div class="box box3">

                    <p>/2023</p>
                </div>
                <h1>400 <span>+</span></h1>
            </div>

            <div class="box box4">
                <div class="btns">
                    <a href=""><ion-icon name="notifications-circle-outline" style="font-size: 3em;"></ion-icon></a>
                    <p> 28 metrics</p>
                </div>

                <div class="btns-bt">
                    <p>
                    Easily track <br>
                    business metrics
                </p>
                <a href="" style="border: none;"><ion-icon name="arrow-forward-outline" style="transform: rotate(45deg); font-size: 3em;"></ion-icon></a>
                </div>
            </div>
            <div class="box box5">
                <div class="btns">
                    <a href="" ><ion-icon name="logo-apple-appstore" style="font-size: 3em; color: black;"></ion-icon></a>
                    <p style="border: 1px solid black;">
                         App rating: &nbsp;
                          <ion-icon name="star" style="color: orangered;"></ion-icon>
                          <ion-icon name="star" style="color: orangered;"></ion-icon>
                          <ion-icon name="star" style="color: orangered;"></ion-icon>
                          <ion-icon name="star" style="color: orangered;"></ion-icon>
                          <ion-icon name="star" style="color: orangered;"></ion-icon>
                    
                    </p>
                </div>

                <div class="btns-bt">

            
                 <div class="avatar">
                    <img src="logo.png" alt="" width="43px">
                    <img src="logo.png" alt="" width="43px">
                    <img src="logo.png" alt="" width="43px">
                </div>
            
                <p>
                    We are dedicated to helping <br>
                    businesses improve the experience <br>
                    they provide for their customers.
                </p>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
