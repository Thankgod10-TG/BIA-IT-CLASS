<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="form_container">
            <section class="video">
                <video src="VID1.mp4" autoplay loop></video>
            </section>

          <section class="form-section">

              <div class="head">
                  <h2>Create your account</h2>
                  <p>Lets get you started on your journey to grateness !!</p>
              </div>
                <!-- Forms Section  -->
              <form action="">
                  <fieldset>
                    &nbsp; &nbsp; <label for="name">Name</label> <br>
                      <input type="text" class="form-input">
                  </fieldset>

                  <fieldset>
                    &nbsp; &nbsp; <label for="email">Email</label> <br>
                      <input type="email" class="form-input">
                  </fieldset>
                 
                  <fieldset class="pass-gender">
                    <div id="pass">
                        &nbsp; &nbsp;  <label for="password">Password</label> <br> 
                        <input type="password" class="pass">
                    </div>
                    <div>
                        &nbsp; &nbsp;  <label for="password">Gender</label> <br> 
                        <select name="Gender" id="">
                            <option value="Gender"> Select...</option>
                            <option value="male"> Male</option>
                            <option value="female">Female</option>
                            <option value="others">Others</option>
                          </select>
                    </div>
                  </fieldset>
              
                  <fieldset class="check">
                    <input type="checkbox" style="background-color: transparent;"> 
                    <span>Agree to Terms & Conditions</span>
                  </fieldset>
                 
                  <button>Sign In</button>
           
          </form>

          <section class="footer">
            <p>Already have an account ? <a href="">Login</a></p>
          </section>
          </section>

        </div>
    </div>
</body>
</html>
